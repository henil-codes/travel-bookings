services:
  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    build: ./backend
    container_name: booking_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - /app/node_modules
    
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild
        - path: ./backend/src
          target: /app/src
          action: sync+restart
        - path: ./backend
          target: /app
          action: sync
          ignore:
            - node_modules/
            - dist/

  postgres:
    image: postgres:17-alpine
    container_name: booking_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17-alpine
    container_name: booking_db_test
    env_file:
      - .env.test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: booking_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ngok:
    image: ngrok/ngrok:latest
    container_name: booking_ngrok
    depends_on: 
      - api
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "api:3000"
      - "--log=stdout"
    ports:
      - "4040:4040"

volumes:
  pgdata:
  redisdata: