name: Deploy

on: 
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Set up SSH
        run: | 
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Sync app files to server
        run: | 
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yaml \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/docker-compose.prod.yaml

          scp -i ~/.ssh/deploy_key deploy/deploy.sh \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/deploy.sh
      
      - name: Run deploy script on server
        run: | 
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            "chmod +x /home/ubuntu/app/deploy.sh && /home/ubuntu/app/deploy.sh"